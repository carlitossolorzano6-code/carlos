<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = new Promise((r) => (window.__worldResolve = r));
      window.__WORLD_SEAMS = [6.2, 13.6, 18.5, 25.6, 33.5];
      window.__WORLD_DUR = 38.6;
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07031a; }
      #root { position: relative; width: 100%; height: 100%; font-family: "Archivo Black", sans-serif; overflow: hidden; }
      #world { position: absolute; inset: 0; z-index: 0; }
      #world-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      #fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
      #fx-scrim { position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(7,3,26,0.55) 0%, rgba(7,3,26,0.35) 30%, rgba(7,3,26,0.15) 55%, rgba(7,3,26,0.45) 100%); }
      #fx-scan { position: absolute; inset: 0; opacity: 0.18;
        background: repeating-linear-gradient(180deg, rgba(0,0,0,0.55) 0 2px, transparent 2px 5px); }
      #fx-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(5,2,18,0.85) 100%); }
      #fx-grain { position: absolute; left: -200px; top: -200px; width: 1480px; height: 2320px; opacity: 0.09; mix-blend-mode: overlay; }
      #stage { position: absolute; inset: 0; z-index: 2; }
      #stage > div { position: absolute; inset: 0; }
      #flash { position: absolute; inset: 0; z-index: 6; background: #fff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.6" data-width="1080" data-height="1920">
      <div id="world" class="clip" data-start="0" data-duration="38.6" data-track-index="0" data-track-kind="graphics">
        <canvas id="world-canvas" width="720" height="1280"></canvas>
      </div>

      <div id="fx" class="clip" data-start="0" data-duration="38.6" data-track-index="1" data-track-kind="graphics">
        <div id="fx-scrim"></div>
        <canvas id="fx-grain" width="370" height="580"></canvas>
        <div id="fx-scan"></div>
        <div id="fx-vig"></div>
      </div>

      <div id="stage">
        <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6.2" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="fact1" data-composition-id="fact1" data-composition-src="compositions/fact1.html" data-start="6.2" data-duration="7.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="fact2" data-composition-id="fact2" data-composition-src="compositions/fact2.html" data-start="13.6" data-duration="4.9" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="fact3" data-composition-id="fact3" data-composition-src="compositions/fact3.html" data-start="18.5" data-duration="7.1" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="fact4" data-composition-id="fact4" data-composition-src="compositions/fact4.html" data-start="25.6" data-duration="7.9" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
        <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="33.5" data-duration="5.1" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      </div>

      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html" data-start="6.2" data-duration="27.3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="38.6" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="flash" class="clip" data-start="0" data-duration="38.6" data-track-index="5" data-track-kind="graphics"></div>

      <audio id="voice" src="assets/voice-norm.mp3" data-start="0" data-duration="37.64" data-track-index="6" data-volume="1"></audio>
    </div>

    <script type="module" src="assets/js/world.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

      // film grain: one seeded noise tile, jumped to a new offset every 2 frames
      (function grain() {
        const c = document.getElementById("fx-grain"), g = c.getContext("2d");
        const img = g.createImageData(c.width, c.height);
        for (let i = 0; i < img.data.length; i += 4) { const v = hash(i * 0.37) * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
        g.putImageData(img, 0, 0);
        const pos = { k: 0 };
        tl.fromTo(pos, { k: 0 }, { k: 555, duration: 38.6, ease: "none", onUpdate: () => {
          const k = Math.floor(pos.k);
          c.style.transform = `translate(${(hash(k) - 0.5) * 160}px, ${(hash(k + 99) - 0.5) * 160}px) scale(3)`;
        } }, 0);
      })();

      // camera shake on the whole stage: seeded jitter that decays
      function shake(at, amp, dur = 0.38) {
        const steps = 9;
        for (let i = 0; i < steps; i++) {
          const k = 1 - i / steps;
          tl.to("#stage", { x: (hash(at * 10 + i) - 0.5) * 2 * amp * k, y: (hash(at * 20 + i) - 0.5) * 2 * amp * k, rotation: (hash(at * 30 + i) - 0.5) * 1.6 * k, duration: dur / steps, ease: "none" }, at + (i * dur) / steps);
        }
        tl.to("#stage", { x: 0, y: 0, rotation: 0, duration: 0.06, ease: "none" }, at + dur);
      }
      // white/neon flash at a cut
      function flash(at, peak = 0.85, color = "#ffffff") {
        tl.set("#flash", { backgroundColor: color }, at - 0.07);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: peak, duration: 0.07, ease: "power2.in" }, at - 0.07);
        tl.to("#flash", { opacity: 0, duration: 0.28, ease: "power2.out" }, at);
      }

      flash(6.2, 0.75); flash(13.6, 0.6, "#22e4ff"); flash(18.5, 0.7, "#ff8a3d"); flash(25.6, 0.6, "#ffd166"); flash(33.5, 0.8, "#ff2e88");
      [[2.0, 26], [6.8, 22], [9.5, 20], [11.45, 16], [15.15, 24], [17.65, 28], [19.0, 22], [22.95, 14], [27.6, 30], [31.05, 18], [33.6, 22]].forEach(([t, a]) => shake(t, a));

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
