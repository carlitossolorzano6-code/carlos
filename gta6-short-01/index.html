<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --night: #0b0620;
        --pink: #ff2e88;
        --cyan: #22e4ff;
        --sun: #ff8a3d;
        --cream: #fff4e6;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Archivo Black", sans-serif; }
      #bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
      #bg-sky {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, #0b0620 0%, #2a0b4a 38%, #7a1460 62%, #ff5e62 80%, #ff9a3d 100%);
      }
      #bg-drift { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #bg-sun {
        position: absolute; left: 240px; top: 1180px; width: 600px; height: 600px; border-radius: 50%;
        background: repeating-linear-gradient(180deg, #ffd166 0 34px, transparent 34px 46px),
          linear-gradient(180deg, #ffd166, #ff2e88);
        -webkit-mask: linear-gradient(180deg, #000 0 55%, transparent 55%);
        mask: repeating-linear-gradient(180deg, #000 0 30px, transparent 30px 40px);
        opacity: 0.55;
      }
      #bg-grid {
        position: absolute; left: -540px; top: 1480px; width: 2160px; height: 700px;
        background-image: linear-gradient(rgba(34, 228, 255, 0.35) 2px, transparent 2px),
          linear-gradient(90deg, rgba(34, 228, 255, 0.35) 2px, transparent 2px);
        background-size: 90px 90px;
        transform-origin: 50% 0%;
        opacity: 0.6;
      }
      #bg-palms { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #bg-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at 50% 40%, transparent 35%, rgba(11, 6, 32, 0.75) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="37" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="37" data-track-index="0" data-track-kind="graphics">
        <div id="bg-sky"></div>
        <div id="bg-drift">
          <div id="bg-sun"></div>
          <div id="bg-grid"></div>
          <svg id="bg-palms" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <g fill="#12051f">
              <!-- left palm -->
              <path d="M70 1920 C90 1700 120 1540 175 1400 L190 1405 C140 1550 112 1710 100 1920 Z" />
              <path d="M180 1400 C110 1360 40 1380 -20 1440 C60 1390 120 1395 178 1412 Z" />
              <path d="M180 1400 C150 1320 80 1290 0 1300 C80 1320 130 1350 172 1410 Z" />
              <path d="M182 1398 C220 1320 300 1300 370 1330 C290 1330 240 1360 190 1412 Z" />
              <path d="M184 1400 C260 1380 330 1410 380 1470 C320 1430 260 1420 188 1414 Z" />
              <path d="M180 1398 C175 1320 200 1260 250 1230 C215 1280 200 1330 190 1405 Z" />
              <!-- right palm -->
              <path d="M1010 1920 C990 1680 960 1500 900 1340 L885 1345 C940 1510 970 1690 980 1920 Z" />
              <path d="M895 1340 C970 1300 1050 1320 1110 1380 C1030 1335 960 1335 897 1352 Z" />
              <path d="M895 1340 C930 1260 1000 1230 1090 1240 C1000 1260 950 1290 903 1350 Z" />
              <path d="M893 1338 C850 1260 770 1240 700 1270 C780 1270 840 1300 885 1352 Z" />
              <path d="M891 1340 C815 1320 745 1350 695 1410 C755 1370 815 1360 887 1354 Z" />
              <path d="M895 1338 C900 1260 875 1200 825 1170 C860 1220 875 1270 885 1345 Z" />
              <!-- skyline -->
              <path d="M300 1560 h40 v-120 h50 v80 h30 v-180 h60 v140 h40 v-90 h50 v170 h30 v-60 h60 v60 h40 v-130 h50 v130 h30 v60 H300 Z" opacity="0.85" />
            </g>
          </svg>
        </div>
        <div id="bg-vignette"></div>
      </div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="fact1" data-composition-id="fact1" data-composition-src="compositions/fact1.html" data-start="5.8" data-duration="6.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="fact2" data-composition-id="fact2" data-composition-src="compositions/fact2.html" data-start="12.5" data-duration="8.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="fact3" data-composition-id="fact3" data-composition-src="compositions/fact3.html" data-start="21.3" data-duration="6.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="fact4" data-composition-id="fact4" data-composition-src="compositions/fact4.html" data-start="27.9" data-duration="4.7" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="32.6" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="37" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 5"></div>

      <audio id="voice" src="assets/voice-norm.mp3" data-start="0" data-duration="36.05" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-drift", { y: 0, scale: 1 }, { y: -40, scale: 1.06, duration: 37, ease: "none" }, 0);
      tl.fromTo("#bg-grid", { rotationX: 62, y: 0 }, { rotationX: 62, y: 90, duration: 37, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
